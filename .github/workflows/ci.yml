name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      # No secrets are provided, and none are needed: every external service is faked.
      # If a test ever starts requiring a live key, this job is where it fails loudly
      # rather than the test quietly being skipped.
      - name: Run tests
        run: pytest -q

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # This repository commits a .env.example by design, and that file has already
      # been overwritten once with the real values from .env. A grep is cruder than a
      # dedicated scanner but it runs in two seconds and catches exactly the four
      # shapes this project handles.
      - name: Scan tracked files for credentials
        run: |
          set -o pipefail
          # The PEM pattern requires real key material after the marker, not just the
          # marker. Test fixtures legitimately contain "BEGIN PRIVATE KEY-----\nnotarealkey",
          # and a scanner that fails on those is a scanner someone disables by Friday.
          patterns='gsk_[A-Za-z0-9]{20,}'
          patterns="$patterns"'|BEGIN[ A-Z]*PRIVATE KEY-----(\\n)?[A-Za-z0-9+/]{40,}'
          patterns="$patterns"'|[0-9]{6,12}:AA[A-Za-z0-9_-]{25,}'
          patterns="$patterns"'|SMTP_PASSWORD=[A-Za-z0-9]{12,}'
          if git ls-files -z | xargs -0 grep -nEI "$patterns" ; then
            echo "::error::A credential pattern was found in a tracked file."
            exit 1
          fi
          echo "No credential patterns in tracked files."

      - name: Refuse to track credential files by name
        run: |
          if git ls-files | grep -nE '(^|/)(service-account\.json|.*\.pem|.*\.p12|credentials/)'; then
            echo "::error::A credential file is tracked."
            exit 1
          fi
          echo "No credential files tracked."

      - name: Confirm .env and credentials/ are ignored
        run: |
          for path in .env credentials/service-account.json; do
            if ! git check-ignore -q "$path"; then
              echo "::error::$path is not gitignored"
              exit 1
            fi
          done
          echo "Secret paths are ignored."

  build:
    runs-on: ubuntu-latest
    needs: [test, secrets]
    steps:
      - uses: actions/checkout@v4

      # Build only. Proving the image assembles catches a broken Dockerfile here
      # rather than during a deploy, and needs no registry credentials.
      - name: Build the image
        run: docker build -t brightcare-clinic-bot:${{ github.sha }} .

      # A placeholder string will not do here: config resolves credentials eagerly at
      # startup, and google-auth rejects anything that is not a loadable PEM. Generating
      # a throwaway key is what makes this a real test of the startup path.
      - name: Generate a throwaway service-account key
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out ci.pem
          python - <<'PY' > ci-sa.json
          import json
          print(json.dumps({
              "type": "service_account", "project_id": "ci",
              "private_key": open("ci.pem").read(),
              "client_email": "ci@ci.iam.gserviceaccount.com",
              "token_uri": "https://oauth2.googleapis.com/token",
          }))
          PY

      - name: Confirm the image starts and serves /health
        run: |
          docker run -d --name bot -p 8000:8000 \
            -e TELEGRAM_BOT_TOKEN="000000:ci-not-a-real-token" \
            -e GROQ_API_KEY="gsk-ci-placeholder" \
            -e GROQ_MODEL="openai/gpt-oss-20b" \
            -e GOOGLE_CALENDAR_ID="ci@example.com" \
            -e TIMEZONE="Asia/Kolkata" \
            -e GOOGLE_SERVICE_ACCOUNT_JSON="$(cat ci-sa.json)" \
            brightcare-clinic-bot:${{ github.sha }}

          # Telegram will answer 401 to the fake token throughout. That is the point:
          # the app must stay up and keep serving /health rather than crash-loop, so a
          # bad token in production looks like a running service with a visible error.
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health; then echo; ok=1; break; fi
            sleep 2
          done
          docker logs bot
          test "${ok:-0}" = "1" || { echo "::error::/health never responded"; exit 1; }

      - name: Confirm the image runs unprivileged and carries no secrets
        run: |
          test "$(docker exec bot id -u)" != "0" || { echo "::error::running as root"; exit 1; }
          docker exec bot sh -c 'test ! -f /app/.env' || { echo "::error::.env baked into the image"; exit 1; }
          echo "Unprivileged, and no .env in the image."

      - name: Clean up
        if: always()
        run: |
          docker rm -f bot 2>/dev/null || true
          rm -f ci.pem ci-sa.json
